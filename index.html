<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロジスティック写像：時系列とリターンマップ</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7f8;color:#18232b;margin:0}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:1.5rem}.controls{background:white;padding:16px;border-radius:12px;display:flex;gap:15px;flex-wrap:wrap;align-items:center}.controls label{display:flex;gap:8px;align-items:center}input[type=range]{width:210px}.plots{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.panel{background:white;padding:12px;border-radius:12px}canvas{width:100%;height:auto;display:block}button{border:1px solid #ccd4d9;border-radius:8px;background:white;padding:8px 12px;cursor:pointer}button:hover{background:#eaf3fa}.note{line-height:1.7;font-size:.93rem;color:#48565f}@media(max-width:750px){.plots{grid-template-columns:1fr}.controls{display:block}.controls label{margin:10px 0}}</style></head><body><main><h1>ロジスティック写像：時系列とリターンマップ</h1><div class="controls"><label>λ <input id="lambda" type="range" min="2.5" max="4" step="0.001" value="3.5"><strong id="lv">3.500</strong></label><label>初期値 x₀ <input id="x0" type="number" min="0.001" max="0.999" step="0.001" value="0.2" style="width:75px"></label><label>反復数 <input id="count" type="number" min="10" max="500" step="10" value="100" style="width:65px"></label><label>速度 <input id="speed" type="range" min="1" max="60" value="12"><span id="sv">12</span>点/秒</label><button id="play">▶ 再生</button><button id="step">1ステップ</button><button id="reset">最初から</button><button id="all">すべて表示</button></div><div class="controls" style="margin-top:10px"><span>代表値：</span><button data-l="2.9">2.9 固定点</button><button data-l="3.2">3.2 2周期</button><button data-l="3.5">3.5 4周期</button><button data-l="3.9">3.9 カオス</button><label><input id="transient" type="checkbox">最初の50点を薄く表示</label></div><div class="plots"><section class="panel"><h2>時系列 xₙ</h2><canvas id="ts" width="600" height="430"></canvas></section><section class="panel"><h2>リターンマップ (xₙ, xₙ₊₁)</h2><canvas id="rm" width="600" height="430"></canvas></section></div><p id="status" class="note"></p><p class="note">青い点・線は現在までの反復結果、赤い点は最新の状態です。リターンマップの灰色の曲線は xₙ₊₁ = λxₙ(1−xₙ)、破線は xₙ₊₁ = xₙ です。右図では横軸が現在値、縦軸が次の値です。λを変更すると初期値から再計算します。</p></main><script>
const $=id=>document.getElementById(id);let xs=[],shown=0,playing=false,last=0;const margins={l:53,r:20,t:20,b:44};function build(){let x=Math.max(.001,Math.min(.999,Number($('x0').value)||.2)),r=+$('lambda').value,n=Math.max(10,Math.min(500,Number($('count').value)||100));xs=[x];for(let i=0;i<n;i++){x=r*x*(1-x);xs.push(x)}shown=0;playing=false;$('play').textContent='▶ 再生';draw()}function axis(ctx,W,H,xmax,xlab,ylab){let m=margins,w=W-m.l-m.r,h=H-m.t-m.b;ctx.strokeStyle='#aab5bd';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(m.l,m.t);ctx.lineTo(m.l,H-m.b);ctx.lineTo(W-m.r,H-m.b);ctx.stroke();ctx.fillStyle='#4d5c65';ctx.font='14px system-ui';ctx.textAlign='center';for(let i=0;i<=5;i++){let x=m.l+i*w/5,y=H-m.b-i*h/5;ctx.fillText((xmax*i/5).toFixed(xmax===1?1:0),x,H-m.b+20);ctx.textAlign='right';ctx.fillText((i/5).toFixed(1),m.l-10,y+5);ctx.textAlign='center';ctx.strokeStyle='#e9edef';ctx.beginPath();ctx.moveTo(x,m.t);ctx.lineTo(x,H-m.b);ctx.moveTo(m.l,y);ctx.lineTo(W-m.r,y);ctx.stroke()}ctx.fillStyle='#18232b';ctx.fillText(xlab,m.l+w/2,H-7);ctx.save();ctx.translate(17,m.t+h/2);ctx.rotate(-Math.PI/2);ctx.fillText(ylab,0,0);ctx.restore();return {x:v=>m.l+v/xmax*w,y:v=>H-m.b-v*h}}function dot(c,x,y,color,r=3){c.beginPath();c.arc(x,y,r,0,2*Math.PI);c.fillStyle=color;c.fill()}function draw(){let n=xs.length-1,r=+$('lambda').value;$('lv').textContent=r.toFixed(3);$('sv').textContent=$('speed').value;$('status').textContent=`表示中: ${shown} / ${n} 反復　${shown?`最新値 x${shown} = ${xs[shown].toFixed(5)}`:`初期値 x₀ = ${xs[0].toFixed(5)}`}`;let a=$('ts'),c=a.getContext('2d');c.clearRect(0,0,a.width,a.height);let q=axis(c,a.width,a.height,n,'反復回数 n','xₙ');c.lineWidth=1.6;for(let i=0;i<=shown;i++){if(i>0){c.strokeStyle=($('transient').checked&&i<=50)?'#b9d6e7':'#2384b8';c.beginPath();c.moveTo(q.x(i-1),q.y(xs[i-1]));c.lineTo(q.x(i),q.y(xs[i]));c.stroke()}dot(c,q.x(i),q.y(xs[i]),($('transient').checked&&i<50)?'#b9d6e7':'#2384b8',2)}dot(c,q.x(shown),q.y(xs[shown]),'#d94b42',5);let b=$('rm'),d=b.getContext('2d');d.clearRect(0,0,b.width,b.height);let p=axis(d,b.width,b.height,1,'xₙ','xₙ₊₁');d.setLineDash([5,5]);d.strokeStyle='#a8adb2';d.beginPath();d.moveTo(p.x(0),p.y(0));d.lineTo(p.x(1),p.y(1));d.stroke();d.setLineDash([]);d.strokeStyle='#c0cbd2';d.lineWidth=2;d.beginPath();for(let i=0;i<=300;i++){let x=i/300,y=r*x*(1-x);if(i===0)d.moveTo(p.x(x),p.y(y));else d.lineTo(p.x(x),p.y(y))}d.stroke();for(let i=0;i<shown;i++){let fade=$('transient').checked&&i<50;dot(d,p.x(xs[i]),p.y(xs[i+1]),fade?'#c4d8e6':'#2384b8',3)}if(shown>0)dot(d,p.x(xs[shown-1]),p.y(xs[shown]),'#d94b42',6)}function advance(){if(shown<xs.length-1){shown++;draw()}else{playing=false;$('play').textContent='▶ 再生'}}$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ 一時停止':'▶ 再生';last=performance.now()};$('step').onclick=()=>{playing=false;$('play').textContent='▶ 再生';advance()};$('reset').onclick=build;$('all').onclick=()=>{playing=false;$('play').textContent='▶ 再生';shown=xs.length-1;draw()};$('lambda').oninput=build;$('x0').onchange=build;$('count').onchange=build;$('speed').oninput=draw;$('transient').onchange=draw;document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{$('lambda').value=b.dataset.l;build()});function loop(t){if(playing){let dt=Math.min(.2,(t-last)/1000);if(dt>=1/(+$('speed').value)){let steps=Math.max(1,Math.floor(dt*(+$('speed').value)));for(let j=0;j<steps;j++)advance();last=t}}requestAnimationFrame(loop)}build();requestAnimationFrame(loop);
</script></body></html>
